<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marta Domingo</title>
<meta name="description" content="Marta Domingo is a designer based in Barcelona. Design Manager for Core Experiences at Miro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F2F7;
    --ink: #1C1C1E;
    --gutter: 5vw;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    font-weight: 400;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  section {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    padding: 6vh var(--gutter);
  }

  .col {
    width: 50%;
  }

  p {
    margin: 0;
    font-size: 1.5rem;
    line-height: 1.35;
    letter-spacing: -0.015em;
    text-wrap: pretty;
  }

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
    transition: text-decoration-color 0.3s ease;
  }

  a:hover {
    text-decoration-color: rgba(28, 28, 30, 0.35);
  }

  @media (max-width: 700px) {
    .col { width: 100%; }
    p { font-size: 1.25rem; }
  }
</style>
</head>
<body>
  <section>
    <div class="col">
      <p>Marta Domingo is a designer based in Barcelona. Currently at Miro, working as a Design Manager for Core Experiences. Previously at HP, leading the Design Lab.</p>
    </div>
  </section>

  <section>
    <div class="col">
      <p>Some recent work on her portfolio includes <a href="https://miro.com/" target="_blank" rel="noopener noreferrer">Miro Aura Product Language</a> and <a href="https://www.hp.com/us-en/printers/large-format/printos.html" target="_blank" rel="noopener noreferrer">HP Production Hub</a>.</p>
    </div>
  </section>
</body>
</html>
