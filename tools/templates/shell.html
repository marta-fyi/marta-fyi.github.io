<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — Marta Domingo</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://marta.fyi/work/{{slug}}/">
<meta name="theme-color" content="#F2F2F7">
<meta property="og:type" content="article">
<meta property="og:url" content="https://marta.fyi/work/{{slug}}/">
<meta property="og:title" content="{{title}} — Marta Domingo">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://marta.fyi/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
{{extras}}</head>
<body>
  <a class="home" href="/" aria-label="Home">
    <img class="spinner" src="/assets/spinner.png" alt="">
  </a>

  <main class="study">
    <h1>{{title}}</h1>
{{live}}
    <div class="body">
{{body}}
    </div>
  </main>

  <nav class="pager">
{{pager}}
  </nav>

  <footer>
    <button type="button" class="copy" data-clip="hello@marta.fyi">
      hello@marta.fyi
      <svg class="glyph copy-glyph" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/>
        <path d="M10.5 3.5A1.5 1.5 0 0 0 9 2H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 10"/>
      </svg>
      <svg class="glyph done-glyph" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 8.5 6 11.5 13 4.5"/>
      </svg>
    </button>
    <a href="https://www.linkedin.com/in/marta-domingo/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    <a class="cv" href="/assets/marta-domingo-cv.pdf" type="application/pdf" download>
      CV
      <svg class="glyph arrow-glyph" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 3v8M4.5 7.5 8 11l3.5-3.5"/>
      </svg>
    </a>
    <span class="sr-only" role="status" aria-live="polite"></span>
  </footer>

  <script src="/script.js" defer></script>
</body>
</html>
