<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fig-width" content="540">
<title>Lifecycle clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tools/figures/figure.css">
<style>
.pairbox { gap: 12px; }
.state { margin-bottom: 7px; font-size: 10px; }
.state::before { width: 7px; height: 7px; }
.canvas { padding: 8px; }
.frame { min-height: 168px; padding: 22px 10px 10px; }
.frame[data-frame]::before { top: 6px; left: 8px; font-size: 8px; }
.sticky { font-size: 7px; padding: 3px; border-radius: 4px; }
.ai-frame { padding: 16px 6px 7px; font-size: 8px; border-radius: 6px; }
.ai-frame::before { top: 4px; left: 6px; font-size: 7px; }
.collision { padding: 2px 5px; font-size: 7px; border-radius: 4px; }
.existing { grid-template-columns: repeat(2, 36px); gap: 5px; padding: 6px; }
.existing .sticky { width: 36px; height: 36px; }
.existing-label { margin: 4px 0 0; font-size: 8px; }
.messy { position: relative; height: 136px; }
.messy .sticky { position: absolute; width: 38px; height: 38px; }
.messy .sticky:nth-child(1) { left: 2%; top: 4px; }
.messy .sticky:nth-child(2) { left: 30%; top: 46px; transform: rotate(5deg); }
.messy .sticky:nth-child(3) { left: 58%; top: 8px; }
.messy .sticky:nth-child(4) { left: 68%; top: 76px; transform: rotate(-4deg); }
.messy .sticky:nth-child(5) { left: 12%; top: 92px; }
.zones { position: relative; display: grid; grid-template-columns: 1fr 1.25fr 1fr;
         gap: 14px; align-content: center; height: 136px; }
.zone { align-self: center; }
.zone { padding: 8px 6px; border: 1px solid var(--line); background: var(--panel); }
.zone strong { display: block; font-size: 9px; }
.zone span { display: block; margin-top: 3px; color: var(--secondary); font-size: 7px; }
.zrow { display: flex; gap: 4px; margin-top: 7px; }
.zrow .sticky { width: 22px; height: 22px; }
.za { position: absolute; top: 56px; color: var(--secondary); font-size: 11px; }
.za.one { left: 28.5%; } .za.two { left: 70%; }
</style>
</head>
<body>
<div class="sheet">
<div class="pairbox">
<div><p class="state">Bad output &mdash; everything appears at once</p><div class="canvas"><div class="frame" data-frame="Workshop"><div class="messy"><div class="sticky ">Prompt</div><div class="sticky coral">Idea</div><div class="sticky cyan">Vote</div><div class="sticky mint">Action</div><div class="sticky lilac">Note</div></div></div></div></div>
<div><p class="state good">Good output &mdash; the activity has a path</p><div class="canvas"><div class="frame" data-frame="Workshop"><div class="zones"><div class="zone"><strong>Entry</strong><span>Goal</span></div><div class="zone"><strong>Work</strong><div class="zrow"><div class="sticky "></div><div class="sticky coral"></div></div></div><div class="zone"><strong>Exit</strong><span>Vote, close</span></div><span class="za one">&rarr;</span><span class="za two">&rarr;</span></div></div></div></div>
</div>
</div>
</body>
</html>
