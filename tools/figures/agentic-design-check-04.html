<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fig-width" content="540">
<title>Interactive integrity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tools/figures/figure.css">
<style>
.pairbox { gap: 12px; }
.state { margin-bottom: 7px; font-size: 10px; }
.state::before { width: 7px; height: 7px; }
.canvas { padding: 8px; }
.frame { min-height: 168px; padding: 22px 10px 10px; }
.frame[data-frame]::before { top: 6px; left: 8px; font-size: 8px; }
.sticky { font-size: 7px; padding: 3px; border-radius: 4px; }
.ai-frame { padding: 16px 6px 7px; font-size: 8px; border-radius: 6px; }
.ai-frame::before { top: 4px; left: 6px; font-size: 7px; }
.collision { padding: 2px 5px; font-size: 7px; border-radius: 4px; }
.existing { grid-template-columns: repeat(2, 36px); gap: 5px; padding: 6px; }
.existing .sticky { width: 36px; height: 36px; }
.existing-label { margin: 4px 0 0; font-size: 8px; }
.tools { display: grid; gap: 8px; align-content: center; height: 136px; }
.fake, .real { padding: 8px; border: 1px solid var(--line); background: var(--panel);
               text-align: center; }
.fake strong { display: block; margin-bottom: 3px; font-size: 13px; }
.fake span { color: var(--muted); font-size: 7px; }
.real { background: #fff; }
.real strong { display: block; font-size: 9px; }
.real > span { display: block; margin: 2px 0 6px; color: var(--secondary); font-size: 7px; }
.ai-tool { display: block; padding: 4px; font-size: 7px; }
</style>
</head>
<body>
<div class="sheet">
<div class="pairbox">
<div><p class="state">Bad output &mdash; decoration imitates function</p><div class="canvas"><div class="frame" data-frame="Workshop tools"><div class="tools"><div class="fake"><strong>05:00</strong><span>Text styled as a timer</span></div><div class="fake"><strong>&#9679; &#9679; &#9679;</strong><span>Dots styled as voting</span></div></div></div></div></div>
<div><p class="state good">Good output &mdash; the tools perform the action</p><div class="canvas"><div class="frame" data-frame="Workshop tools"><div class="tools"><div class="real"><strong>Timer</strong><span>5 minutes &middot; ready</span><span class="ai-tool">Start timer</span></div><div class="real"><strong>Voting</strong><span>3 votes per person</span><span class="ai-tool">Open voting</span></div></div></div></div></div>
</div>
</div>
</body>
</html>
