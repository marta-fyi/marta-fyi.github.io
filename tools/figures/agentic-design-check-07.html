<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fig-width" content="540">
<title>Product-language fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tools/figures/figure.css">
<style>
.pairbox { gap: 12px; }
.state { margin-bottom: 7px; font-size: 10px; }
.state::before { width: 7px; height: 7px; }
.canvas { padding: 8px; }
.frame { min-height: 168px; padding: 22px 10px 10px; }
.frame[data-frame]::before { top: 6px; left: 8px; font-size: 8px; }
.sticky { font-size: 7px; padding: 3px; border-radius: 4px; }
.ai-frame { padding: 16px 6px 7px; font-size: 8px; border-radius: 6px; }
.ai-frame::before { top: 4px; left: 6px; font-size: 7px; }
.collision { padding: 2px 5px; font-size: 7px; border-radius: 4px; }
.existing { grid-template-columns: repeat(2, 36px); gap: 5px; padding: 6px; }
.existing .sticky { width: 36px; height: 36px; }
.existing-label { margin: 4px 0 0; font-size: 8px; }
.chaos { display: grid; gap: 8px; align-content: center; height: 136px;
         justify-items: center; }
.chaos div { padding: 7px 10px; text-align: center; }
.c1 { border-radius: 20px; background: var(--lilac); font-family: Georgia, serif;
      font-size: 11px; }
.c2 { background: var(--red); color: #fff; font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; }
.c3 { border: 1px dashed var(--secondary); font-family: ui-monospace, Menlo, monospace;
      font-size: 9px; }
.coherent { display: grid; gap: 8px; align-content: center; height: 136px; }
.co { padding: 8px; border: 1px solid var(--line); background: var(--panel); }
.co strong { display: block; margin-bottom: 6px; font-size: 9px; }
.crow2 { display: flex; gap: 5px; }
.crow2 .sticky { width: 26px; height: 26px; }
</style>
</head>
<body>
<div class="sheet">
<div class="pairbox">
<div><p class="state">Bad output &mdash; every object speaks differently</p><div class="canvas"><div class="frame" data-frame="Project review"><div class="chaos"><div class="c1">Main objective</div><div class="c2">IMPORTANT</div><div class="c3">random_style()</div></div></div></div></div>
<div><p class="state good">Good output &mdash; the system feels related</p><div class="canvas"><div class="frame" data-frame="Project review"><div class="coherent"><div class="co"><strong>Evidence</strong><div class="crow2"><div class="sticky "></div><div class="sticky cyan"></div></div></div><div class="co"><strong>Decision</strong><div class="crow2"><div class="sticky coral"></div><div class="sticky mint"></div></div></div></div></div></div></div>
</div>
</div>
</body>
</html>
