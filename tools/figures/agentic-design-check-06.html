<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fig-width" content="540">
<title>Output delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tools/figures/figure.css">
<style>
.pairbox { gap: 12px; }
.state { margin-bottom: 7px; font-size: 10px; }
.state::before { width: 7px; height: 7px; }
.canvas { padding: 8px; }
.frame { min-height: 168px; padding: 22px 10px 10px; }
.frame[data-frame]::before { top: 6px; left: 8px; font-size: 8px; }
.sticky { font-size: 7px; padding: 3px; border-radius: 4px; }
.ai-frame { padding: 16px 6px 7px; font-size: 8px; border-radius: 6px; }
.ai-frame::before { top: 4px; left: 6px; font-size: 7px; }
.collision { padding: 2px 5px; font-size: 7px; border-radius: 4px; }
.existing { grid-template-columns: repeat(2, 36px); gap: 5px; padding: 6px; }
.existing .sticky { width: 36px; height: 36px; }
.existing-label { margin: 4px 0 0; font-size: 8px; }
.cloud { position: relative; height: 136px; }
.cloud .sticky { position: absolute; width: 36px; height: 36px; }
.cloud .sticky:nth-child(1) { left: 12%; top: 10px; }
.cloud .sticky:nth-child(2) { left: 38%; top: 42px; }
.cloud .sticky:nth-child(3) { left: 60%; top: 8px; }
.cloud .sticky:nth-child(4) { left: 66%; top: 62px; }
.dead { position: absolute; left: 0; right: 0; bottom: 0; margin: 0;
        color: var(--muted); font-size: 8px; text-align: center; }
.path { display: grid; gap: 2px; align-content: center; height: 136px; }
.step { padding: 6px 8px; border: 1px solid var(--line); background: var(--panel);
        color: var(--secondary); font-size: 7px; }
.step strong { display: block; color: var(--text); font-size: 9px; }
.step.act { border: 1px solid var(--blue); background: var(--blue-wash); }
.step.act strong { color: var(--blue-deep); }
.da { color: var(--secondary); font-size: 10px; text-align: center; line-height: 1; }
</style>
</head>
<body>
<div class="sheet">
<div class="pairbox">
<div><p class="state">Bad output &mdash; stops at conversation</p><div class="canvas"><div class="frame" data-frame="Workshop result"><div class="cloud"><div class="sticky ">Idea</div><div class="sticky coral">Idea</div><div class="sticky cyan">Idea</div><div class="sticky mint">Idea</div><p class="dead">Ends as an unstructured cluster</p></div></div></div></div>
<div><p class="state good">Good output &mdash; converts discussion into action</p><div class="canvas"><div class="frame" data-frame="Workshop result"><div class="path"><div class="step"><strong>Evidence</strong>Grouped ideas</div><span class="da">&darr;</span><div class="step"><strong>Decision</strong>What we agree to do</div><span class="da">&darr;</span><div class="step act"><strong>Action</strong>Owner &middot; due date</div></div></div></div></div>
</div>
</div>
</body>
</html>
